name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, beta, dev]
  push:
    branches: [main, beta, dev]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev \
            gcc libcairo2-dev pkg-config python3-dev \
            libglib2.0-dev libglib2.0-dev-bin \
            libgtk-4-dev libadwaita-1-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run tests
        run: python -m pytest tests/

      - name: Run pre-commit
        run: python -m pre_commit run --all-files --show-diff-on-failure

  build-flatpak:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = Path('version').read_text().strip()
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit(f'Expected a stable release tag such as v1.1.0, got {tag!r}')
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} does not match version file {version!r}')
          root = ET.parse('share/metainfo/io.github.mall0r.Twinverse.metainfo.xml').getroot()
          release = root.find('releases/release')
          if release is None or release.get('version') != version:
              raise SystemExit('The latest AppStream release must match the version file')
          PY

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree elfutils libglib2.0-dev-bin \
            appstream-compose librsvg2-common

      - name: Check AppStream composition
        run: |
          app_id=io.github.mall0r.Twinverse
          root="$RUNNER_TEMP/appstream-input"
          install -Dm644 "share/metainfo/$app_id.metainfo.xml" "$root/share/metainfo/$app_id.metainfo.xml"
          install -Dm644 "share/applications/$app_id.desktop" "$root/share/applications/$app_id.desktop"
          install -Dm644 "share/icons/hicolor/scalable/apps/$app_id.svg" "$root/share/icons/hicolor/scalable/apps/$app_id.svg"
          appstreamcli compose --no-net --prefix=/ --origin=twinverse \
            --components="$app_id,$app_id.desktop" --print-report=full \
            --result-root="$RUNNER_TEMP/appstream-output" \
            --hints-dir="$RUNNER_TEMP/appstream-hints" "$root"

      - name: Add Flathub repository
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: bash scripts/package-flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ github.ref_name }}
          path: Twinverse-*.flatpak
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-${{ github.ref_name }}
          path: dist

      - name: Publish release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.flatpak --clobber
